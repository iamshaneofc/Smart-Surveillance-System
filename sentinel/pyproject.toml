[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel"
version = "0.1.0"
description = "SENTINEL - AI-powered video surveillance and security intelligence platform (foundation phase)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
    "SQLAlchemy>=2.0",
    "alembic>=1.13",
    "redis>=5.0",
]

[project.optional-dependencies]
postgres = ["psycopg2-binary>=2.9"]
video = ["opencv-python-headless>=4.9"]
infer = ["onnxruntime>=1.17"]
dev = ["pytest>=8.0", "httpx>=0.27", "onnxruntime>=1.17", "onnx>=1.16"]

[tool.setuptools.packages.find]
where = ["."]
include = ["apps*", "services*", "packages*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
