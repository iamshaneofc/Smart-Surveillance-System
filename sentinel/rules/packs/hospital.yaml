name: hospital-safety
version: "0.1"
industry: hospital
description: >
  Hospital safety profile - restricted-area access, after-hours activity,
  emergency-area dwell. Fall/violence candidates arrive with temporal
  analyzers (rule_type: temporal_signal, phase F6).
default_classes: [person]
rules:
  - rule_id: restricted-area-entry
    name: Restricted area entry
    rule_type: zone_enter
    event_type: restricted_zone_intrusion
    severity: high
    zone_ids: [restricted]
    params:
      classes: [person]
    cooldown_seconds: 60
    confirm_seconds: 2
    min_confidence: 0.5

  - rule_id: emergency-area-dwell
    name: Emergency area blocked/dwell
    rule_type: zone_dwell
    event_type: crowding
    severity: medium
    zone_ids: [emergency]
    params:
      classes: [person]
      dwell_seconds: 30
    cooldown_seconds: 300
    confirm_seconds: 5
    min_confidence: 0.5

  - rule_id: after-hours-movement
    name: After-hours movement
    rule_type: zone_enter
    event_type: after_hours_movement
    severity: high
    zone_ids: [restricted]
    params:
      classes: [person]
    schedule:
      timezone: UTC
      windows:
        - days: [0, 1, 2, 3, 4, 5, 6]
          start: "21:00"
          end: "07:00"
    cooldown_seconds: 120
    confirm_seconds: 5
    min_confidence: 0.5
